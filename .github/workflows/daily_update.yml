name: Daily Allianz NAV Update

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

# --- 加入這段 (強制開啟寫入權限) ---
permissions:
  contents: write
# --------------------------------

jobs:
  update:
    runs-on: ubuntu-latest
    # ... (下方保持不變)
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      # 步驟 1: 如果 data.json 不存在，嘗試用 CSV 初始化
      - name: Initialize Data (if needed)
        run: python init_data.py
        
      # 步驟 2: 執行每日更新
      - name: Run Update Script
        run: python update_data.py

      # 步驟 3: 存檔
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto update NAV: $(date +'%Y-%m-%d')" || exit 0
          git push
