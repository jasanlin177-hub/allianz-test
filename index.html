<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安聯台灣科技基金 - 專業回測儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* === 核心修復：讓滑桿互不干擾 === */
        .slider-container { position: relative; height: 40px; margin-top: 10px; touch-action: none; }
        
        .slider-track {
            position: absolute; top: 50%; transform: translateY(-50%);
            height: 6px; width: 100%; background: #e2e8f0; border-radius: 999px; z-index: 1;
        }
        .slider-range {
            position: absolute; top: 50%; transform: translateY(-50%);
            height: 6px; background: #3b82f6; z-index: 2; border-radius: 999px;
        }
        
        /* 關鍵 CSS：input 本身不擋滑鼠，只有圓點 (thumb) 擋滑鼠 */
        input[type=range] {
            position: absolute; 
            pointer-events: none; /* 讓點擊穿透透明軌道 */
            -webkit-appearance: none;
            z-index: 3; 
            height: 100%; 
            width: 100%; 
            opacity: 0; 
            cursor: pointer;
            top: 0; margin: 0;
        }
        
        /* 針對 Webkit (Chrome, Safari, Edge) 的圓點設定 */
        input[type=range]::-webkit-slider-thumb {
            pointer-events: auto; /* 圓點恢復可點擊 */
            -webkit-appearance: none;
            width: 30px; height: 30px; /* 加大觸控區 */
            cursor: pointer;
            border-radius: 50%;
        }

        /* 針對 Firefox 的圓點設定 */
        input[type=range]::-moz-range-thumb {
            pointer-events: auto;
            width: 30px; height: 30px;
            cursor: pointer;
            border-radius: 50%;
        }

        /* 視覺上的圓點 (Thumb Visuals) */
        .thumb {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; background: #fff; border: 2px solid #2563eb;
            border-radius: 50%; z-index: 4; box-shadow: 0 2px 5px rgba(0,0,0,0.2); pointer-events: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        /* 避免被選取 */
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span class="bg-blue-600 text-white p-1.5 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </span>
                    <h1 class="text-xl font-bold text-slate-800">安聯台灣科技基金 <span class="text-slate-400 font-normal text-sm ml-2">回測系統 Pro</span></h1>
                </div>
                <div id="status-dot" class="flex items-center text-sm text-slate-500">
                    <span class="w-2.5 h-2.5 bg-yellow-400 rounded-full mr-2 animate-pulse"></span> 載入數據中...
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">投資策略設定</h2>
                
                <div class="flex bg-slate-100 p-1 rounded-lg mb-6">
                    <button id="btn-mode-lump" onclick="switchMode('lump')" class="flex-1 py-2 text-sm font-medium rounded-md shadow bg-white text-blue-700 transition-all">單筆投入</button>
                    <button id="btn-mode-dca" onclick="switchMode('dca')" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">定期定額</button>
                </div>

                <div id="input-lump" class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">單筆投入金額 (TWD)</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-500 sm:text-sm">$</span>
                        </div>
                        <input type="number" id="lump-sum-amount" value="100000" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-7 pr-3 py-2 sm:text-sm border-slate-300 rounded-md border" placeholder="100000">
                    </div>
                </div>

                <div id="input-dca" class="mb-6 hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">每月扣款金額 (TWD)</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-500 sm:text-sm">$</span>
                        </div>
                        <input type="number" id="dca-amount" value="5000" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-7 pr-3 py-2 sm:text-sm border-slate-300 rounded-md border" placeholder="5000">
                    </div>
                    <p class="text-xs text-slate-400 mt-2 flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg>
                        系統自動鎖定每月 1 號 (或首個交易日) 扣款
                    </p>
                </div>

                <div class="mt-6 pt-6 border-t border-slate-100">
                    <h3 id="result-title" class="text-sm font-medium text-slate-500 mb-3">單筆投入績效</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-lg">
                            <p class="text-xs text-slate-400 mb-1">總投入成本</p>
                            <p id="res-cost" class="text-lg font-bold text-slate-700">--</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg">
                            <p class="text-xs text-slate-400 mb-1">期末總資產</p>
                            <p id="res-final" class="text-lg font-bold text-blue-700">--</p>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center justify-between bg-white border border-slate-100 p-3 rounded-lg shadow-sm">
                        <span class="text-sm text-slate-600 font-medium">總報酬率</span>
                        <span id="res-roi" class="text-xl font-bold text-gray-400">0.0%</span>
                    </div>
                </div>

                <button onclick="forceRecalculate()" class="w-full mt-6 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition-transform active:scale-95">
                    立即試算 🚀
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">回測期間選擇</h2>
                
                <div class="flex justify-between text-sm font-medium text-slate-700 mb-2 no-select">
                    <span id="label-start-date" class="tabular-nums">--</span>
                    <span id="label-end-date" class="tabular-nums">--</span>
                </div>

                <div class="slider-container">
                    <div class="slider-track"></div>
                    <div class="slider-range" id="slider-range"></div>
                    
                    <input type="range" id="range-start" min="0" max="100" value="0" step="1">
                    <input type="range" id="range-end" min="0" max="100" value="100" step="1">
                    
                    <div class="thumb" id="thumb-start"></div>
                    <div class="thumb" id="thumb-end"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-6">
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800">歷史淨值走勢 (NAV)</h3>
                </div>
                <div class="relative h-80 w-full">
                    <canvas id="chartNAV"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center">
                        回撤風險 (Underwater Plot)
                        <div class="group relative ml-2">
                            <svg class="w-4 h-4 text-slate-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="group-hover:opacity-100 transition-opacity bg-gray-800 px-2 py-1 text-xs text-white rounded-md absolute left-1/2 -translate-x-1/2 bottom-full mb-2 opacity-0 w-48 text-center pointer-events-none z-10">
                                顯示當前價格距離歷史最高點跌了多少百分比。
                            </span>
                        </div>
                    </h3>
                </div>
                <div class="relative h-48 w-full">
                    <canvas id="chartDrawdown"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 變數宣告 ---
        let fullData = []; 
        let displayData = []; 
        let chartNAV = null;
        let chartDrawdown = null;
        let debounceTimer = null; 
        let currentMode = 'lump'; // 'lump' (單筆) or 'dca' (定期定額)

        // --- 初始化 ---
        async function initData() {
            const statusDot = document.getElementById('status-dot');
            
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("找不到資料檔");
                
                fullData = await response.json();

                const lastDate = fullData[fullData.length - 1][0];
                statusDot.innerHTML = `<span class="w-2.5 h-2.5 bg-green-500 rounded-full mr-2"></span> 數據更新至 ${lastDate}`;

                initSlider();
                
                // 預設顯示全部資料
                const rangeStart = document.getElementById('range-start');
                const rangeEnd = document.getElementById('range-end');
                rangeStart.value = 0;
                rangeEnd.value = fullData.length - 1;
                
                updateSliderVisuals();
                updateCharts();

            } catch (e) {
                console.error(e);
                statusDot.innerHTML = `<span class="w-2.5 h-2.5 bg-red-500 rounded-full mr-2"></span> 讀取失敗`;
            }
        }

        // --- 切換模式 (Tabs) ---
        function switchMode(mode) {
            currentMode = mode;
            const btnLump = document.getElementById('btn-mode-lump');
            const btnDca = document.getElementById('btn-mode-dca');
            const inputLump = document.getElementById('input-lump');
            const inputDca = document.getElementById('input-dca');
            const resultTitle = document.getElementById('result-title');

            if (mode === 'lump') {
                // 樣式切換
                btnLump.className = "flex-1 py-2 text-sm font-medium rounded-md shadow bg-white text-blue-700 transition-all";
                btnDca.className = "flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all";
                // 欄位切換
                inputLump.classList.remove('hidden');
                inputDca.classList.add('hidden');
                resultTitle.innerText = "單筆投入績效";
            } else {
                btnLump.className = "flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all";
                btnDca.className = "flex-1 py-2 text-sm font-medium rounded-md shadow bg-white text-blue-700 transition-all";
                inputLump.classList.add('hidden');
                inputDca.classList.remove('hidden');
                resultTitle.innerText = "定期定額績效";
            }
            calculateMetrics(); // 重新計算結果
        }

        // --- 滑桿邏輯 (修復左滑桿卡頓) ---
        function initSlider() {
            const rangeStart = document.getElementById('range-start');
            const rangeEnd = document.getElementById('range-end');
            const maxIdx = fullData.length - 1;

            rangeStart.max = maxIdx;
            rangeEnd.max = maxIdx;

            // 監聽輸入事件
            rangeStart.addEventListener('input', handleSliderInput);
            rangeEnd.addEventListener('input', handleSliderInput);
        }

        function handleSliderInput(e) {
            const rangeStart = document.getElementById('range-start');
            const rangeEnd = document.getElementById('range-end');
            
            let startVal = parseInt(rangeStart.value);
            let endVal = parseInt(rangeEnd.value);

            const minGap = 20; // 最小間隔
            
            // 防止交叉邏輯
            if (e.target.id === 'range-start') {
                if (startVal > endVal - minGap) {
                    rangeStart.value = endVal - minGap;
                }
            } else {
                if (endVal < startVal + minGap) {
                    rangeEnd.value = startVal + minGap;
                }
            }

            // 1. 視覺立即更新 (不卡頓)
            updateSliderVisuals();

            // 2. 延遲計算
            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                updateCharts();
            }, 50); // 50ms 延遲
        }

        function updateSliderVisuals() {
            const rangeStart = document.getElementById('range-start');
            const rangeEnd = document.getElementById('range-end');
            const maxIdx = fullData.length - 1;
            
            const percentStart = (rangeStart.value / maxIdx) * 100;
            const percentEnd = (rangeEnd.value / maxIdx) * 100;
            
            document.getElementById('slider-range').style.left = percentStart + '%';
            document.getElementById('slider-range').style.width = (percentEnd - percentStart) + '%';
            
            document.getElementById('thumb-start').style.left = percentStart + '%';
            document.getElementById('thumb-end').style.left = percentEnd + '%';

            // 更新文字
            const startIdx = parseInt(rangeStart.value);
            const endIdx = parseInt(rangeEnd.value);
            if(fullData[startIdx]) document.getElementById('label-start-date').innerText = fullData[startIdx][0];
            if(fullData[endIdx]) document.getElementById('label-end-date').innerText = fullData[endIdx][0];
        }

        // --- 強制重新計算 ---
        function forceRecalculate() {
            calculateMetrics();
        }

        // --- 繪製圖表與計算 ---
        function updateCharts() {
            const rangeStart = parseInt(document.getElementById('range-start').value);
            const rangeEnd = parseInt(document.getElementById('range-end').value);
            
            displayData = fullData.slice(rangeStart, rangeEnd + 1);
            if (displayData.length === 0) return;

            const labels = displayData.map(d => d[0]);
            const prices = displayData.map(d => d[1]);

            // 計算 Drawdown
            let peak = -Infinity;
            const drawdowns = prices.map(price => {
                if (price > peak) peak = price;
                return ((price - peak) / peak) * 100;
            });

            renderNAVChart(labels, prices);
            renderDrawdownChart(labels, drawdowns);
            calculateMetrics();
        }

        function calculateMetrics() {
            if (displayData.length === 0) return;

            // 根據模式選擇計算邏輯
            let totalCost = 0;
            let finalValue = 0;
            let roi = 0;

            const startPrice = displayData[0][1];
            const endPrice = displayData[displayData.length - 1][1];

            if (currentMode === 'lump') {
                // 單筆投入
                const lumpSumAmt = parseFloat(document.getElementById('lump-sum-amount').value) || 0;
                totalCost = lumpSumAmt;
                const units = lumpSumAmt / startPrice;
                finalValue = units * endPrice;
                roi = totalCost > 0 ? ((finalValue - totalCost) / totalCost) * 100 : 0;

            } else {
                // 定期定額 (每月1號)
                const dcaAmt = parseFloat(document.getElementById('dca-amount').value) || 0;
                let totalUnits = 0;
                let lastInvestMonth = "";

                displayData.forEach(row => {
                    const dateStr = row[0];
                    const nav = row[1];
                    const monthStr = dateStr.substring(0, 7);

                    // 遇到該月份第一筆資料就買入
                    if (lastInvestMonth !== monthStr) {
                        const unitsBought = dcaAmt / nav;
                        totalUnits += unitsBought;
                        totalCost += dcaAmt;
                        lastInvestMonth = monthStr;
                    }
                });
                finalValue = totalUnits * endPrice;
                roi = totalCost > 0 ? ((finalValue - totalCost) / totalCost) * 100 : 0;
            }

            // 更新 UI
            document.getElementById('res-cost').innerText = formatCurrency(totalCost);
            document.getElementById('res-final').innerText = formatCurrency(finalValue);
            
            const roiEl = document.getElementById('res-roi');
            roiEl.innerText = roi.toFixed(2) + "%";
            
            roiEl.classList.remove('text-red-500', 'text-green-500', 'text-gray-400');
            if (roi > 0) {
                roiEl.classList.add('text-red-500');
                roiEl.innerText = "+" + roiEl.innerText;
            } else if (roi < 0) {
                roiEl.classList.add('text-green-500');
            } else {
                roiEl.classList.add('text-gray-400');
            }
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        }

        // --- Chart.js 繪圖 ---
        function renderNAVChart(labels, data) {
            const ctx = document.getElementById('chartNAV').getContext('2d');
            if (chartNAV) chartNAV.destroy();

            chartNAV = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '基金淨值',
                        data: data,
                        borderColor: '#2563eb',
                        backgroundColor: (context) => {
                            const ctx = context.chart.ctx;
                            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                            gradient.addColorStop(0, 'rgba(37, 99, 235, 0.2)');
                            gradient.addColorStop(1, 'rgba(37, 99, 235, 0)');
                            return gradient;
                        },
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { position: 'right' }
                    }
                }
            });
        }

        function renderDrawdownChart(labels, data) {
            const ctx = document.getElementById('chartDrawdown').getContext('2d');
            if (chartDrawdown) chartDrawdown.destroy();

            chartDrawdown = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '回撤幅度 (%)',
                        data: data,
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220, 38, 38, 0.1)',
                        borderWidth: 1,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            ticks: { maxTicksLimit: 6, maxRotation: 0 } 
                        },
                        y: { 
                            position: 'right',
                            min: Math.min(...data) * 1.1,
                            max: 0,
                            ticks: {
                                // 修正重點：只顯示小數點後 1 位
                                callback: function(value) {
                                    return value.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = initData;
    </script>
</body>
</html>
