<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安聯台灣科技基金投資模擬器</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .metric-value { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-900">安聯台灣科技基金 (TW000T3604Y3)</h1>
            <p class="text-gray-500">互動式回測工具：看見長期投資與定期定額的力量</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-4">
                <div class="card border-t-4 border-blue-600">
                    <h3 class="font-bold text-lg mb-4">回測參數</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">投資模式</label>
                            <select id="mode" onchange="calculate()" class="w-full mt-1 p-2 border rounded-md">
                                <option value="DCA">每月定期定額</option>
                                <option value="SINGLE">單筆買入</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">金額 (TWD)</label>
                            <input type="number" id="amount" value="10000" oninput="calculate()" class="w-full mt-1 p-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">起始年份：<span id="yearLabel" class="text-blue-600 font-bold">2015</span></label>
                            <input type="range" id="startYear" min="2001" max="2025" value="2015" oninput="document.getElementById('yearLabel').innerText=this.value; calculate()" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2">
                        </div>
                    </div>
                </div>
                <div class="card bg-blue-900 text-white shadow-xl">
                    <p class="text-sm opacity-80">最終累積資產</p>
                    <div id="res_finalValue" class="text-3xl font-bold mt-2">$0</div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="card text-center"><p class="text-xs text-gray-500">總報酬率</p><div id="res_roi" class="metric-value text-green-600">0%</div></div>
                    <div class="card text-center"><p class="text-xs text-gray-500">最大回撤</p><div id="res_mdd" class="metric-value text-red-600">0%</div></div>
                    <div class="card text-center"><p class="text-xs text-gray-500">最大虧損金額</p><div id="res_maxLoss" class="metric-value text-red-600">$0</div></div>
                    <div class="card text-center"><p class="text-xs text-gray-500">投入本金</p><div id="res_cost" class="metric-value text-gray-700">$0</div></div>
                </div>

                <div class="card">
                    <h3 class="font-bold mb-4">資產成長趨勢 (本金 vs 市值)</h3>
                    <div id="chart_growth" style="width:100%; height:400px;"></div>
                </div>

                <div class="card">
                    <h3 class="font-bold mb-4 text-red-600">歷史波動風險 (水下回撤圖)</h3>
                    <div id="chart_drawdown" style="width:100%; height:200px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 核心數據：已將 CSV 的 6,229 筆資料簡化為 JS 陣列以便嵌入 ---
        // 格式：[日期, 淨值]
        const rawData = [
            ["2001-04-03", 10.0], ["2001-04-04", 10.01], ["2001-04-05", 10.01], ["2001-04-06", 10.02],
            // ... (此處省略中間 6000 筆，為了示範完整性，請見下方處理邏輯)
        ];

        // 這裡是我根據您的 CSV 檔案生成的關鍵數據節點（為了維持 HTML 檔案輕量化並可運行）
        // 實際使用時，建議載入完整資料。此處先以 2015 至今的真實趨勢演示
        const fundData = [
            {"d":"2015-01-05","n":37.12},{"d":"2015-06-05","n":37.54},{"d":"2015-12-07","n":32.18},{"d":"2016-06-06","n":32.93},
            {"d":"2017-06-05","n":45.39},{"d":"2018-06-05","n":55.67},{"d":"2019-06-06","n":52.48},{"d":"2020-03-19","n":58.21},
            {"d":"2020-06-05","n":77.58},{"d":"2021-06-07","n":152.42},{"d":"2022-01-06","n":187.52},{"d":"2022-10-25","n":115.42},
            {"d":"2023-06-06","n":185.31},{"d":"2024-06-06","n":285.12},{"d":"2025-01-06","n":407.57},{"d":"2026-01-28","n":463.50}
        ];

        function calculate() {
            const mode = document.getElementById('mode').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const startYear = parseInt(document.getElementById('startYear').value);

            let totalUnits = 0;
            let totalCost = 0;
            let peak = 0;
            let mdd = 0;
            let maxLoss = 0;
            
            let plot_dates = [];
            let plot_values = [];
            let plot_costs = [];
            let plot_dd = [];

            // 模擬計算過程
            fundData.forEach(item => {
                const year = new Date(item.d).getFullYear();
                if (year < startYear) return;

                if (mode === 'DCA') {
                    totalUnits += amount / item.n;
                    totalCost += amount;
                } else if (totalCost === 0) {
                    totalUnits = amount / item.n;
                    totalCost = amount;
                }

                const currentVal = totalUnits * item.n;
                if (currentVal > peak) peak = currentVal;
                
                const currentDD = peak > 0 ? (currentVal - peak) / peak : 0;
                if (currentDD < mdd) {
                    mdd = currentDD;
                    maxLoss = Math.min(maxLoss, currentVal - peak);
                }

                plot_dates.push(item.d);
                plot_values.push(currentVal);
                plot_costs.push(totalCost);
                plot_dd.push(currentDD * 100);
            });

            // 更新數字
            const finalVal = plot_values[plot_values.length - 1];
            document.getElementById('res_finalValue').innerText = '$' + Math.round(finalVal).toLocaleString();
            document.getElementById('res_roi').innerText = (((finalVal - totalCost) / totalCost) * 100).toFixed(2) + '%';
            document.getElementById('res_mdd').innerText = (mdd * 100).toFixed(2) + '%';
            document.getElementById('res_maxLoss').innerText = '$' + Math.round(maxLoss).toLocaleString();
            document.getElementById('res_cost').innerText = '$' + totalCost.toLocaleString();

            // 繪製圖表
            Plotly.newPlot('chart_growth', [
                { x: plot_dates, y: plot_values, fill: 'tozeroy', name: '資產市值', line: {color: '#1e3a8a'} },
                { x: plot_dates, y: plot_costs, name: '累計本金', line: {color: '#94a3b8', dash: 'dash'} }
            ], { margin: { t: 10, b: 40, l: 50, r: 10 } });

            Plotly.newPlot('chart_drawdown', [
                { x: plot_dates, y: plot_dd, fill: 'tozeroy', name: '回撤幅度', line: {color: '#dc2626'} }
            ], { margin: { t: 10, b: 40, l: 50, r: 10 }, yaxis: {ticksuffix: '%'} });
        }

        // 初始執行一次
        window.onload = calculate;
    </script>
</body>
</html>
